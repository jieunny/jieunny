<script>
 window.onload = function () {
  const container = document.querySelector(".con");
  const items = document.querySelectorAll(".item");
  const textBox = document.getElementById("mainText");

  let typingTimer = null;
  let activeItem = null;

  items.forEach(item => {
    let startX, startY;
    let startLeft, startTop;
    let moved = false;

    item.addEventListener("mousedown", e => {
      e.preventDefault();
      moved = false;
      startX = e.clientX;
      startY = e.clientY;

      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", stop);
    });

    function move(e) {
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      // 🔥 진짜 드래그 판정
      if (!moved && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) {
        moved = true;

        const rect = item.getBoundingClientRect();
        const parent = container.getBoundingClientRect();

        item.style.left = rect.left - parent.left + "px";
        item.style.top  = rect.top  - parent.top  + "px";

        startLeft = item.offsetLeft;
        startTop  = item.offsetTop;
      }

      if (!moved) return;

      item.style.left = startLeft + dx + "px";
      item.style.top  = startTop  + dy + "px";
    }

    function stop() {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", stop);

      if (!moved) return;

      const cw = container.clientWidth;
      const ch = container.clientHeight;

      item.style.left = (item.offsetLeft / cw * 100) + "%";
      item.style.top  = (item.offsetTop  / ch * 100) + "%";
    }

  }); // ✅ forEach 닫힘

}; // ✅ window.onload 닫힘

</script>
